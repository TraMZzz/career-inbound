# TODO(starter): stage 6 — delete this line, set the repository variable CAPSTONE_STAGE to 6
# and add the ANTHROPIC_API_KEY secret. Until CAPSTONE_STAGE >= 6 the job is skipped.
# Runs the golden set against the service on every PR and fails below the quality threshold.
name: evals

on:
  pull_request:
  workflow_dispatch:

env:
  CI_TOOLS: git+https://github.com/<ORG>/career-inbound@tools-v0.1.0#subdirectory=tools
  MIN_PASS: "0.8"

jobs:
  evals:
    if: ${{ fromJSON(vars.CAPSTONE_STAGE || '1') >= 6 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync
      - name: start service
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done; exit 1
      - name: golden set
        run: uvx --from "$CI_TOOLS" ci-eval run --url http://localhost:8000 --min-pass "$MIN_PASS" --out evals/results.ci.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: evals/results.ci.json
