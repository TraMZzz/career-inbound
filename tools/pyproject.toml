[project]
name = "ci-tools"
version = "0.1.0"
description = "Career Inbound course tools: language-agnostic evals, perf and injection tests over the POST /ask contract, plus stage self-checks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.13,<3",
    "pydantic>=2.11,<3",
]

[project.scripts]
ci-eval = "ci_tools.eval_cli:main"
ci-check = "ci_tools.check_cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_tools"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
