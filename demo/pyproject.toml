[project]
name = "on-call-copilot"
version = "0.1.0"
description = "Reference project of the Career Inbound course: an on-call assistant for the demo-shop service."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9,<2",
    "fastapi>=0.142,<1",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=9,<10",
    "ruff>=0.16,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
